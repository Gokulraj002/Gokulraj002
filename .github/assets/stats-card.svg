  <g><circle cx="855" cy="378" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle><text x="820" y="382" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#22c55e" text-anchor="end">live</text></g>
